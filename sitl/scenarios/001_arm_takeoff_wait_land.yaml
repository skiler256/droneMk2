id: 001_arm_takeoff_wait_land
description: >
  Scenario trivial "SITL nu" (roadmap etape 2) : armer, decoller, tenir 5s,
  atterrir. Verifie que le plombage bout-en-bout fonctionne (procman,
  mission_driver, shm_observer, verdict) -- pas la trajectoire elle-meme
  (ca, c'est l'etape 3, "Nav valide sur SITL nu").

plan: 001_arm_takeoff_wait_land.plan.yaml
monde: world_engine/worlds/empty.json

mission:
  # EKF3 a besoin de ~30s pour converger a froid (attitude/position) avant
  # d'accepter l'arm -- mesure en session reelle sur ce projet.
  - {type: wait, duration: 50}
  - {type: arm}
  - {type: wait, duration: 5}
  - {type: takeoff, alt: 10}
  - {type: wait, duration: 60}
  - {type: land}

criteres:
  - {metrique: mission_state_sequence, attendu: [Armed, Mission, Landing]}
  - {metrique: aucun_code_emergency, attendu: true}
  - {metrique: processus_vivants_a_la_fin, attendu: [drone, udp_bridge]}

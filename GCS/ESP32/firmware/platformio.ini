; GCS/ESP32/firmware/platformio.ini
; ─────────────────────────────────────────────────────────────────────────────
; Firmware "bête" : pas de logique métier ici, toute la décision (quel code
; allume quel voyant, priorité des alarmes) vit côté Node.js (GCS/serial-bridge.js).
; L'ESP32 relaie juste le port série <-> les E/S physiques (MCP23017 + GPIO).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I ../shared
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2

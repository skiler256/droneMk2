; Liaison CC1101 côté station sol — pendant du banc ./bench_cc1101 côté
; drone. Projet séparé du firmware du panneau d'alarme (../firmware).
;
; La table de registres doit rester identique à celle de
; src/SystemMonitoring/CC1101_Driver.cpp : un seul écart et les deux bouts
; ne se parlent pas, sans qu'aucun message ne l'indique.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I ../shared
